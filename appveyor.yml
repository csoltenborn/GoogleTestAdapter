version: 0.19.0.{build}
image: Visual Studio 2022
configuration: Release
platform: Any CPU
environment:
  # Encrypted for the AppVeyor account of the original project; to sign releases with the release key, replace it with
  # the password encrypted for this fork's AppVeyor account (https://ci.appveyor.com/tools/encrypt). Without it, the
  # assemblies are signed with Keys\Key_Debug.snk.
  RELEASE_KEY_PASSWORD:
    secure: 3+fpAMwxomiOZ5fzpb+3kjV4RvPSn0GRvFp71bZZs3QQr06zNU2Wvu4p77dmTKH+
install:
- ps: >-
    if ($env:APPVEYOR_REPO_TAG -eq "true" -and $env:RELEASE_KEY_PASSWORD) {
        nuget install secure-file -ExcludeVersion -OutputDirectory NuGetPackages
        NuGetPackages\secure-file\tools\secure-file -decrypt GoogleTestAdapter\Keys\Key_Release.snk.enc -secret $env:RELEASE_KEY_PASSWORD
    }
before_build:
- cmd: pushd GoogleTestAdapter && call .\SetVersion.bat %APPVEYOR_BUILD_VERSION% && popd
# measures speed-up of parallel test execution, which is unreliable on CI machines
- cmd: pushd GoogleTestAdapter\TestAdapter.Tests && call .\IgnoreTests.bat TestExecutorParallelTests.cs::RunTests_ParallelTestExecution_SpeedsUpTestExecution && popd
build_script:
# restores the NuGet packages and builds GTA including the sample tests and the VSIX (see DEVELOPMENT.md)
- cmd: msbuild GoogleTestAdapter\GoogleTestAdapter.sln -restore -p:RestorePackagesConfig=true -p:Configuration=%CONFIGURATION% -p:Platform="%PLATFORM%" -m -verbosity:minimal -logger:"C:\Program Files\AppVeyor\BuildAgent\Appveyor.MSBuildLogger.dll"
after_build:
- ps: >-
    $version = $env:APPVEYOR_BUILD_VERSION.SubString(0, $env:APPVEYOR_BUILD_VERSION.LastIndexOf("."))

    $sourceFile = (Resolve-Path ("out\binaries\GoogleTestAdapter\" + $env:CONFIGURATION + "\Packaging.GTA\Packaging.GTA.vsix")).ToString()

    $targetFile = $([IO.FileInfo]$sourceFile).DirectoryName + "\GoogleTestAdapter-" + $version + ".vsix"

    Copy-Item -Path $sourceFile -Destination $targetFile

    $releaseNotesFile = (Resolve-Path ("GoogleTestAdapter\VsPackage.GTA\Resources\ReleaseNotes\" + $version + ".md")).ToString()

    $releaseNotes = ([IO.File]::ReadAllLines($releaseNotesFile) -join '\n')

    Write-Output("Release notes: " + $releaseNotes)

    [IO.File]::WriteAllText("C:\\GTAReleaseNotes.txt", $releaseNotes)
test_script:
# the end-to-end tests of VsPackage.Tests and VsPackage.Tests.Generated compare the complete output of test runs with
# expected files, which have not been updated for the changes of the fork yet (see DEVELOPMENT.md)
- ps: >-
    $binaries = "out\binaries\GoogleTestAdapter\$env:CONFIGURATION"

    & vstest.console.exe "$binaries\DiaResolver.Tests\GoogleTestAdapter.DiaResolver.Tests.dll" "$binaries\Core.Tests\GoogleTestAdapter.Core.Tests.dll" "$binaries\TestAdapter.Tests\GoogleTestAdapter.TestAdapter.Tests.dll" "$binaries\VsPackage.GTA.Tests.Unit\GoogleTestAdapter.VsPackage.GTA.Tests.Unit.dll" /Parallel /Logger:Appveyor

    $TestExitCode = $LASTEXITCODE

    if ($TestExitCode -ne 0) {
        $version = $env:APPVEYOR_BUILD_VERSION.SubString(0, $env:APPVEYOR_BUILD_VERSION.LastIndexOf("."))
        $packagingDir = "$binaries\Packaging.GTA"
        Push-AppveyorArtifact "$packagingDir\GoogleTestAdapter-$version.vsix"
        Push-AppveyorArtifact "$packagingDir\GoogleTestAdapter.$version.nupkg"

        exit $TestExitCode
    }
before_deploy:
- set /p RELEASE_NOTES=<"C:\\GTAReleaseNotes.txt"
artifacts:
- path: out\binaries\GoogleTestAdapter\$(configuration)\Packaging.GTA\GoogleTestAdapter-*.vsix
  name: VSIX installation package
- path: out\binaries\GoogleTestAdapter\$(configuration)\Packaging.GTA\GoogleTestAdapter.*.nupkg
  name: NuGet package
deploy:
# draft release for tags; the token is encrypted for the AppVeyor account of the original project and has to be
# replaced with a GitHub token of this fork, encrypted for this fork's AppVeyor account
- provider: GitHub
  auth_token:
    secure: yRqT6kz8c9NZEuCUyBjKXvCLUNXcAc41F2Y4fa318ylBPaIcl38UNAK5Jt8MsNhs
  description: $(RELEASE_NOTES)
  draft: true
  prerelease: true
  on:
    branch: master
    appveyor_repo_tag: true
